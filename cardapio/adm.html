<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Painel de Controle</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    
    <section id="secao-painel">
        <div id="dashboard-container" class="dashboard-layout">
    
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>cardapio on</h2>
                    <p>Admin Panel</p>
                </div>
                <nav class="sidebar-nav">
                    <button class="nav-item active" onclick="mudarAba('resumo')">📊 Adicionar item</button>
                    <button class="nav-item" onclick="mudarAba('comandas')">🖨️ Comandas</button>
                    <button class="nav-item" onclick="mudarAba('produtos')">🍔 Produtos</button>
                </nav>
                <div class="sidebar-footer">
                    <button class="btn-logout-side" onclick="fazerLogout()">Sair</button>
                </div>
            </aside>

            <main class="main-dashboard">
                <header class="top-header">
                    <h1 id="titulo-pagina">Visão Geral</h1>
                </header>

                <section class="content-area">
                    <div class="dashboard-card">
                        <h3>Bem-vindo ao gerenciamento!</h3>
                        <p>Aqui você poderá ver as métricas de hoje, ou alternar no menu ao lado para adicionar produtos e imprimir as comandas dos clientes.</p>
                    </div>
                </section>
            </main>
        </div>
    </section>
    <div id="printable-area"></div>

    <script type="module" src="js/adm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
